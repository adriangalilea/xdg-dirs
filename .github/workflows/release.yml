name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # .goreleaser.yaml is `version: 2`; a v3 would change the config format.
          version: '~> v2'
          args: release --clean
        env:
          # Built-in token: covered by `permissions: contents: write` above,
          # never expires (the old GORELEASER_TOKEN PAT rotted -> 401).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
